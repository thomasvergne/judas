[package]
name = "judas"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.dependencies]
judas-ast = { path = "crates/judas-ast" }
judas-parser = { path = "crates/judas-parser" }
judas-infer = { path = "crates/judas-infer" }
judas-codegen = { path = "crates/judas-codegen" }
judas-sim = { path = "crates/judas-sim" }
judas-lsp = { path = "crates/judas-lsp" }
miette = { version = "7.6.0", features = ["derive", "fancy"] }
thiserror = "2.0.21"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.49", features = ["full"] }
tower-lsp = "0.20.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies]
judas-ast = { workspace = true }
judas-parser = { workspace = true }
judas-infer = { workspace = true }
judas-codegen = { workspace = true }
judas-sim = { workspace = true }
judas-lsp = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }


